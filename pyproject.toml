[project]
name = "lmstudio-manager"
version = "0.2.0"
description = "MCP server that manages LM Studio models, benchmarks hardware (CPU/RAM/GPU), and exposes system health over SSE or stdio"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
wmi = ["pywin32>=306"]

[project.urls]
repository = "https://github.com/anomalyco/lmstudio-manager"
